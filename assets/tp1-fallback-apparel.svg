          <path d="M245 75 Q325 160 405 75" fill="none" stroke="#101820" stroke-width="8"/>
          <text x="325" y="345" text-anchor="middle" class="brand">ThePrint1</text>
          <circle cx="190" cy="430" r="28" fill="#00bcd4"/><circle cx="455" cy="430" r="28" fill="#ec4899"/><circle cx="325" cy="500" r="32" fill="#facc15"/>
