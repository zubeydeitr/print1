      .brand{font-family:Arial,'Helvetica Neue',sans-serif;font-size:52px;font-weight:900;fill:#101820;letter-spacing:-1px;}
      .smallbrand{font-size:42px;}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="88" fill="#00bcd4" opacity=".16"/>
  <circle cx="245" cy="785" r="130" fill="#ec4899" opacity=".12"/>
  <circle cx="1450" cy="130" r="120" fill="#facc15" opacity=".16"/>
  <g filter="url(#shadow)">
        <g transform="translate(760 315)">
          <path d="M90 70 L430 20 L650 135 L305 205 Z" fill="#ffffff" stroke="#101820" stroke-width="8"/>
          <path d="M90 70 L305 205 L305 565 L90 410 Z" fill="#f7f8f4" stroke="#101820" stroke-width="8"/>
          <path d="M305 205 L650 135 L650 485 L305 565 Z" fill="#eef6f5" stroke="#101820" stroke-width="8"/>
          <path d="M180 210 L260 255 L260 315 L180 268 Z" fill="#16b6c9" opacity=".95"/>
          <path d="M395 245 L555 210 L555 285 L395 325 Z" fill="#facc15" opacity=".9"/>
