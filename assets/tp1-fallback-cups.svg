        <g transform="translate(820 215)">
          <ellipse cx="310" cy="125" rx="185" ry="48" fill="#fff" stroke="#101820" stroke-width="8"/>
          <path d="M140 125 H480 L430 600 Q310 655 190 600 Z" fill="#ffffff" stroke="#101820" stroke-width="8"/>
          <path d="M174 235 H446 L425 415 Q310 455 195 415 Z" fill="#eef6f5"/>
          <text x="310" y="345" text-anchor="middle" class="brand">ThePrint1</text>
          <circle cx="165" cy="515" r="30" fill="#00bcd4"/><circle cx="240" cy="560" r="22" fill="#ec4899"/><circle cx="450" cy="520" r="28" fill="#facc15"/>
        </g></g>
