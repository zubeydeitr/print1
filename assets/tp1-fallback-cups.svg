      .brand{font-family:Arial,'Helvetica Neue',sans-serif;font-size:52px;font-weight:900;fill:#101820;letter-spacing:-1px;}
      .smallbrand{font-size:42px;}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="88" fill="#00bcd4" opacity=".16"/>
  <circle cx="245" cy="785" r="130" fill="#ec4899" opacity=".12"/>
  <circle cx="1450" cy="130" r="120" fill="#facc15" opacity=".16"/>
