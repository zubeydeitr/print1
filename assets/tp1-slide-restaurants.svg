<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="حلول للمطاعم والمقاهي">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5fbfb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#101820" flood-opacity=".18"/></filter>
    <style>
      .rtl{font-family:Arial,'Helvetica Neue',sans-serif;direction:rtl;unicode-bidi:bidi-override;}
      .title{font-size:72px;font-weight:800;fill:#101820;}
      .subtitle{font-size:34px;fill:#334155;}
      .brand{font-family:Arial,'Helvetica Neue',sans-serif;font-size:52px;font-weight:900;fill:#101820;letter-spacing:-1px;}
      .smallbrand{font-size:42px;}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="88" fill="#00bcd4" opacity=".16"/>
  <circle cx="245" cy="785" r="130" fill="#ec4899" opacity=".12"/>
  <circle cx="1450" cy="130" r="120" fill="#facc15" opacity=".16"/>
  <g filter="url(#shadow)">
        <g transform="translate(790 230)">
          <path d="M160 100 C170 45 245 28 295 70 C342 26 418 42 430 100" fill="none" stroke="#101820" stroke-width="16" stroke-linecap="round"/>
          <path d="M80 110 H515 L570 610 H40 Z" fill="#ffffff" stroke="#101820" stroke-width="8"/>
          <path d="M80 110 H515 L535 290 H60 Z" fill="#eef6f5"/>
          <circle cx="185" cy="210" r="42" fill="#00bcd4" opacity=".85"/>
          <circle cx="300" cy="262" r="42" fill="#ec4899" opacity=".85"/>
          <circle cx="415" cy="215" r="42" fill="#facc15" opacity=".9"/>
          <text x="300" y="415" text-anchor="middle" class="brand">ThePrint1</text>
          <path d="M115 520 H500" stroke="#101820" stroke-width="5" opacity=".25"/>
        </g></g>
  <g class="rtl" text-anchor="start">
    <text x="700" y="215" class="title">حلول للمطاعم والمقاهي</text>
    <text x="700" y="282" class="subtitle">تغليف غذائي مطبوع بتصميم سعودي حديث</text>
    <rect x="175" y="705" width="430" height="76" rx="38" fill="#101820"/>
    <text x="390" y="755" text-anchor="middle" style="font-family:Arial;font-weight:800;font-size:31px;fill:#fff;direction:rtl;unicode-bidi:bidi-override;">اطلب عرض سعر</text>
    <text x="175" y="840" style="font-family:Arial;font-size:28px;fill:#334155;direction:rtl;unicode-bidi:bidi-override;">طباعة مخصصة • تشطيب احترافي • مقاسات حسب الطلب</text>
  </g>
</svg>